name: Sync Garmin Sleep to Notion

# Trimmed down from the original template to ONLY sync sleep + HRV data,
# since that's all Jason's fork is being used for. Runs daily at 9:00 AM
# America/Chicago (14:00 UTC during CDT / 15:00 UTC during CST) — adjust
# the cron below if you'd rather it run at a different time.

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

env:
  TZ: 'America/Chicago'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run sleep sync
        env:
          GARMIN_AUTH_TOKEN: ${{ secrets.GARMIN_AUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SLEEP_DB_ID: ${{ secrets.NOTION_SLEEP_DB_ID }}
          TZ: 'America/Chicago'
          GARMIN_TOKEN_OUTPUT_PATH: 'refreshed_garmin_token.json'
        run: |
          uv run python -m src.workflows.sleep-data

      - name: Persist refreshed Garmin token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          if [ -f refreshed_garmin_token.json ]; then
            gh secret set GARMIN_AUTH_TOKEN --repo "${{ github.repository }}" < refreshed_garmin_token.json
            echo "GARMIN_AUTH_TOKEN secret updated with the refreshed token."
          else
            echo "No refreshed token file was produced — leaving GARMIN_AUTH_TOKEN secret unchanged."
          fi
